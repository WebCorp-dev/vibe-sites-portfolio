name: AI News Bot

on:
  schedule:
    # Каждый час. GitHub может задержать запуск на 5–20 минут — это нормально.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # позволяет запустить вручную из вкладки Actions

permissions:
  contents: read

concurrency:
  group: ai-news
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install --quiet feedparser

      - name: Восстановить список уже отправленных
        uses: actions/cache@v4
        with:
          path: bot/state.json
          key: ai-news-state-${{ github.run_id }}
          restore-keys: |
            ai-news-state-

      - name: Проверить новости и отправить в Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot/ai_news_bot.py
